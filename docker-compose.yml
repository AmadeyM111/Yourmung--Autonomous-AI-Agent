# Yourmung Telegram + local runtime on top of the upstream single
# self-contained image (Dockerfile target "runtime", code in /app, venv /app/.venv).
#   docker compose up -d --build
# Optional transcription stack (build args, all default 0):
#   OUROBOROS_INSTALL_TRANSCRIPTION=1 OUROBOROS_INSTALL_DIARIZATION=1 OUROBOROS_INSTALL_WHISPERX=1 docker compose build
# Exposure: the port is published on 127.0.0.1 only. If you change OUROBOROS_PUBLISH_HOST
# to anything else (e.g. 0.0.0.0), you MUST set OUROBOROS_NETWORK_PASSWORD in .env: a
# missing password only warns and the gate then admits every request.
services:
  ouroboros:
    build:
      context: .
      args:
        OUROBOROS_INSTALL_TRANSCRIPTION: ${OUROBOROS_INSTALL_TRANSCRIPTION:-0}
        OUROBOROS_INSTALL_TRACING: ${OUROBOROS_INSTALL_TRACING:-0}
        OUROBOROS_INSTALL_DIARIZATION: ${OUROBOROS_INSTALL_DIARIZATION:-0}
        OUROBOROS_INSTALL_WHISPERX: ${OUROBOROS_INSTALL_WHISPERX:-0}
    container_name: yourmung-agent
    ports:
      - "${OUROBOROS_PUBLISH_HOST:-127.0.0.1}:8766:8765"
    env_file:
      - .env
    environment:
      OUROBOROS_SERVER_HOST: 0.0.0.0
      OUROBOROS_NETWORK_PASSWORD: ${OUROBOROS_NETWORK_PASSWORD:-}
      OUROBOROS_DATA_DIR: /data
      OUROBOROS_FILE_BROWSER_DEFAULT: /app
      TELEGRAM_STT_BACKEND: ${TELEGRAM_STT_BACKEND:-local}
      TELEGRAM_STT_MODEL: ${TELEGRAM_STT_MODEL:-small}
      TELEGRAM_STT_LANGUAGE: ${TELEGRAM_STT_LANGUAGE:-ru}
      TELEGRAM_STT_DEVICE: ${TELEGRAM_STT_DEVICE:-auto}
      TELEGRAM_STT_COMPUTE_TYPE: ${TELEGRAM_STT_COMPUTE_TYPE:-auto}
      TELEGRAM_STT_MODEL_DIR: /data/models/faster-whisper
      TELEGRAM_STT_TIMEOUT_SEC: ${TELEGRAM_STT_TIMEOUT_SEC:-180}
      TRANSCRIPTION_MODEL_ROUTING: ${TRANSCRIPTION_MODEL_ROUTING:-duration}
      TRANSCRIPTION_MODEL_ROUTES: ${TRANSCRIPTION_MODEL_ROUTES:-1800:large-v3,*:turbo}
      TRANSCRIPTION_CPU_MODEL_ROUTES: ${TRANSCRIPTION_CPU_MODEL_ROUTES:-900:medium,*:small}
      TRANSCRIPTION_ALLOW_MODEL_FALLBACK: ${TRANSCRIPTION_ALLOW_MODEL_FALLBACK:-true}
      TRANSCRIPTION_CHUNK_SEC: ${TRANSCRIPTION_CHUNK_SEC:-900}
      TRANSCRIPTION_OVERLAP_SEC: ${TRANSCRIPTION_OVERLAP_SEC:-2}
      TRANSCRIPTION_MAX_DURATION_SEC: ${TRANSCRIPTION_MAX_DURATION_SEC:-43200}
      TRANSCRIPTION_MODEL_DIR: /data/models/faster-whisper
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
      TRANSCRIPTION_WHISPERX_MODEL: ${TRANSCRIPTION_WHISPERX_MODEL:-large-v3}
      TRANSCRIPTION_WHISPERX_DEVICE: ${TRANSCRIPTION_WHISPERX_DEVICE:-auto}
      TRANSCRIPTION_WHISPERX_COMPUTE_TYPE: ${TRANSCRIPTION_WHISPERX_COMPUTE_TYPE:-float16}
      TRANSCRIPTION_WHISPERX_BATCH_SIZE: ${TRANSCRIPTION_WHISPERX_BATCH_SIZE:-8}
      TRANSCRIPTION_GEMINI_MODEL: ${TRANSCRIPTION_GEMINI_MODEL:-gemini-3.5-transcribe}
      TRANSCRIPTION_GEMINI_MAX_BYTES: ${TRANSCRIPTION_GEMINI_MAX_BYTES:-268435456}
      TRANSCRIPTION_GEMINI_MAX_DURATION_SEC: ${TRANSCRIPTION_GEMINI_MAX_DURATION_SEC:-7200}
      TRANSCRIPTION_GEMINI_MAX_CHUNKS: ${TRANSCRIPTION_GEMINI_MAX_CHUNKS:-8}
      TRANSCRIPTION_GEMINI_VOCAB_PHRASE_MAX_CHARS: ${TRANSCRIPTION_GEMINI_VOCAB_PHRASE_MAX_CHARS:-200}
      TRANSCRIPTION_GEMINI_VOCAB_MAX_BYTES: ${TRANSCRIPTION_GEMINI_VOCAB_MAX_BYTES:-32768}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRANSCRIPTION_DEEPGRAM_MODEL: ${TRANSCRIPTION_DEEPGRAM_MODEL:-nova-3}
      TRANSCRIPTION_DEEPGRAM_MAX_BYTES: ${TRANSCRIPTION_DEEPGRAM_MAX_BYTES:-268435456}
      TRANSCRIPTION_DEEPGRAM_MAX_DURATION_SEC: ${TRANSCRIPTION_DEEPGRAM_MAX_DURATION_SEC:-7200}
      TRANSCRIPTION_DEEPGRAM_MAX_CHUNKS: ${TRANSCRIPTION_DEEPGRAM_MAX_CHUNKS:-8}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TRANSCRIPTION_DIARIZATION: ${TRANSCRIPTION_DIARIZATION:-off}
      TRANSCRIPTION_PYANNOTE_MODEL: ${TRANSCRIPTION_PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
      TRANSCRIPTION_PYANNOTE_DEVICE: ${TRANSCRIPTION_PYANNOTE_DEVICE:-auto}
      TRANSCRIPTION_PYANNOTE_MAX_DURATION_SEC: ${TRANSCRIPTION_PYANNOTE_MAX_DURATION_SEC:-14400}
      HF_TOKEN: ${HF_TOKEN:-}
      PYANNOTE_METRICS_ENABLED: ${PYANNOTE_METRICS_ENABLED:-0}
      OUROBOROS_AUDIO_UPLOAD_MAX_BYTES: ${OUROBOROS_AUDIO_UPLOAD_MAX_BYTES:-1073741824}

      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:6006/v1/traces"
      PHOENIX_PROJECT_NAME: "ouroboros-local"
      PHOENIX_PROTOCOL: "http/protobuf"
      PHOENIX_BATCH: "true"

    volumes:
      - ./data:/data
      - ./.knowledge:/app/.knowledge:ro
    # Phoenix is shared: it runs in the oil-ai-agent project, reachable as "phoenix".
    networks:
      - default
      - phoenix
    restart: unless-stopped
    init: true
    # The image entrypoint is server.py; run the Telegram bridge via the CLI instead.
    entrypoint: ["python", "-m", "ouroboros.cli"]
    command:
      - telegram
      - --host
      - 0.0.0.0
      - --port
      - "8765"

networks:
  phoenix:
    name: oil-ai-agent_default
    external: true
